name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgpgme-dev

      - name: Build
        run: make build

      - name: Unit tests with coverage
        run: |
          mkdir -p coverage
          go test -tags containers_image_openpgp -race -covermode=atomic \
            -coverprofile=coverage/coverage.out ./internal/...

      - name: Functional tests
        run: make test-functional

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/coverage.out
          flags: unittests
          fail_ci_if_error: false

      - name: Lint
        run: make lint
        env:
          GOTOOLCHAIN: go1.26.4

  build-binaries:
    name: Build binaries for multiple architectures
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all binaries to bin/
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: make build

      - name: Stage artifacts
        run: |
          mkdir -p dist
          for bin in bin/*; do
            name=$(basename "$bin")
            cp "$bin" "dist/${name}-${{ matrix.suffix }}"
          done

      - name: Generate checksums
        run: |
          cd dist
          for f in *; do
            sha256sum "$f" > "${f}.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/
          retention-days: 30
