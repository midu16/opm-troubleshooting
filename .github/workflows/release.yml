name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: linux
            goarch: 386
            suffix: linux-386
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all binaries to bin/
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          make build GO_LDFLAGS="-s -w -X main.Version=${VERSION}"

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          for bin in bin/*; do
            name=$(basename "$bin")
            cp "$bin" "dist/${name}-${{ matrix.suffix }}"
            chmod +x "dist/${name}-${{ matrix.suffix }}"
          done

      - name: Create tarballs
        run: |
          cd dist
          for bin in *; do
            tar -czf "${bin}.tar.gz" "$bin"
            sha256sum "${bin}.tar.gz" > "${bin}.tar.gz.sha256"
          done

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 30
