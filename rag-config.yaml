data_dir: rag-data

# Vector database backend. Every endpoint below is configurable here (or via the
# matching OCP_RAG_* environment variable), so no hostname is hard-coded.
vector_store:
  # backend: "chromem" (embedded, on-disk under data_dir/chromem — the default)
  #          or "qdrant" (external, shared service — one writer, many readers).
  # Env override: OCP_RAG_VECTORSTORE_BACKEND
  backend: "chromem"
  qdrant:
    # Qdrant HTTP endpoint FQDN. Point this at your shared Qdrant service.
    # Env override: OCP_RAG_QDRANT_URL
    url: "http://localhost:6333"
    # API key sent as the "api-key" header (Qdrant Cloud / secured deployments).
    # Leave empty for an unauthenticated instance. Env override: OCP_RAG_QDRANT_API_KEY
    api_key: ""
    # Namespaces this deployment's collections (optional). e.g. "ocp422_"
    collection_prefix: ""
    # Similarity metric: Cosine (default), Dot, or Euclid.
    distance: "Cosine"
    # Per-request HTTP timeout to Qdrant.
    timeout: "30s"

# Embedding service (Ollama-compatible). FQDN is configurable here.
# Env overrides: OCP_RAG_EMBEDDING_URL, OCP_RAG_EMBEDDING_MODEL
embedding:
  url: "http://bazzite:11434"
  model: "qwen3-embedding:latest"
openshift:
  version: "4.22"
  docs_base_url: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.22"
  # Base URL for cloning all source repos (docs, telco, operators). Override for a
  # GitHub Enterprise host or an internal mirror. Env override: OCP_RAG_GIT_BASE_URL
  git_base_url: "https://github.com"
  telco_reference:
    repo: "openshift-kni/telco-reference"
    enabled: true
  acm_docs:
    repo: "stolostron/rhacm-docs"
    enabled: true
  versions:
    - version: "4.22"
      docs_branch: "enterprise-4.22"
      operator_branch: "release-4.22"
      telco_branch: "release-4.22"
      acm_docs_branch: "2.17_stage"
    # - version: "4.17"
    #   docs_branch: "enterprise-4.17"
    #   operator_branch: "release-4.17"
    #   telco_branch: "release-4.17"
    #   acm_docs_branch: "2.15_stage"
  repos:
    - cluster-etcd-operator
    - cluster-kube-apiserver-operator
    - cluster-kube-controller-manager-operator
    - cluster-kube-scheduler-operator
    - cluster-version-operator
    - machine-config-operator
    - cluster-network-operator
    - cluster-ingress-operator
    - cluster-storage-operator
    - cluster-monitoring-operator
    - cluster-authentication-operator
    - local-storage-operator
    - sriov-network-operator
    - ptp-operator
    - cluster-nfd-operator
    - metallb-operator
    - cluster-node-tuning-operator
    - cluster-dns-operator
    - cluster-image-registry-operator
    - cluster-samples-operator
    - cluster-logging-operator
    - openshift-apiserver
    - console-operator
    - installer
    - oc
    - api
    - kubernetes-nmstate
    # Day-2 operators outside the openshift/ GitHub org (org/repo form).
    - openshift-kni/cluster-group-upgrades-operator # TALM
    - red-hat-storage/odf-operator # ODF
    - stolostron/multiclusterhub-operator # ACM
    - redhat-developer/gitops-operator # OpenShift GitOps
retrieval:
  default_top_k: 8
  code_top_k: 6
  config_top_k: 4
  issues_top_k: 5
  keyword_supplement_max: 4
  keyword_min_length: 4
chunking:
  chunk_size: 1200
  chunk_overlap: 200
ingestion:
  git_timeout: "60s"
  http_timeout: "30s"
  max_parallel_clones: 4
secret_filter:
  skip_extensions:
    - ".pem"
    - ".crt"
    - ".key"
    - ".p12"
    - ".jks"
    - ".pfx"
    - ".enc"
    - ".gpg"
  skip_filenames:
    - ".env"
    - "pull-secret"
    - "kubeconfig"
    - "credentials"
    - "htpasswd"
    - "id_rsa"
    - "id_ed25519"
freshness:
  meta_file: ".ingest_meta.json"
